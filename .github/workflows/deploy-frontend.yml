name: Deploy Frontend

# frontend/ 변경을 main 에 푸시하면 빌드 후 SeungBlog 레포의 gh-pages 로 배포한다.
# (라이브 URL https://taeseungjeon.github.io/SeungBlog/ 유지)
on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node 22 설치
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: 빌드
        working-directory: frontend
        env:
          # 저장소 Variables 로 설정 (Settings → Secrets and variables → Actions → Variables)
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
        run: npm run build

      - name: SeungBlog 레포 gh-pages 로 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          # SeungBlog 레포에 등록된 배포키(공개키)에 대응하는 비밀키 (Secret)
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: TaeSeungJeon/SeungBlog
          publish_branch: gh-pages
          publish_dir: ./frontend/dist
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: frontend from seungBlog-backend@${{ github.sha }}'
